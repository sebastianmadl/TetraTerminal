# Builds the Android app: on the self-hosted runner "runner1" in the upstream
# repository (ysamouhos), on GitHub's ubuntu-latest runners in forks.
# Outputs (Actions run page -> Artifacts): tetra-terminal-android (debug-signed APKs, for testing).
# Signed release builds are produced by release.yml.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ${{ github.repository_owner == 'ysamouhos' && 'runner1' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: the legacy `tools` package no longer exists.
          packages: ""

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@2.13.0

      - name: Rust core tests
        working-directory: tetra_core
        run: |
          # frb_generated.rs is created by codegen in the next step; tests do not need it.
          sed -i '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs

      - name: App setup (platform folders, Rust bridge, bindings)
        working-directory: app
        run: |
          chmod +x tool/setup.sh
          ./tool/setup.sh

      - name: Analyze + test
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # Android only installs an update over an app signed with the same key.
      # With the keystore secrets the test builds carry the release key, so
      # every build updates the one before. Without them each run signs with
      # its own throwaway debug key and the old app must be uninstalled first.
      - name: Signing key
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a throwaway debug key and cannot update an installed build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "::notice::APKs are signed with the release key."

      - name: Build APKs
        working-directory: app
        run: |
          # Phone build: without the Accessibility key service, which makes
          # Google Play Protect block the install on normal phones.
          python3 tool/android_variant.py phone
          flutter build apk --release
          flutter build apk --release --split-per-abi
          # Named after the app and its version, ready to install.
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk             ../out/TetraTerminal-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   ../out/TetraTerminal-$V-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/TetraTerminal-$V-arm32.apk
          # PoC radio build (Hytera P60 ...): with the key service, so the PTT
          # key and the knob work with the screen locked.
          python3 tool/android_variant.py poc
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk             ../out/TetraTerminal-$V-poc.apk
          # The service must be in the PoC build only.
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          has_service() { "$AAPT" dump xmltree --file AndroidManifest.xml "$1" | grep -c BIND_ACCESSIBILITY_SERVICE || true; }
          [ "$(has_service ../out/TetraTerminal-$V.apk)" = 0 ]
          [ "$(has_service ../out/TetraTerminal-$V-arm64.apk)" = 0 ]
          [ "$(has_service ../out/TetraTerminal-$V-poc.apk)" != 0 ]
          # Which key signed the APKs (an update needs the same one as the installed app).
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ../out/TetraTerminal-$V.apk | grep -E "certificate (DN|SHA-256)" | head -2

      # One upload per file: with archive off the APK downloads as it is, not in a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}-arm64.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}-arm32.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}-poc.apk
          archive: false
