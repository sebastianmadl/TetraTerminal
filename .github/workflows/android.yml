# Builds the Android app: on the self-hosted runner "runner1" in the upstream
# repository (ysamouhos), on GitHub's ubuntu-latest runners in forks.
# Outputs (Actions run page -> Artifacts): tetra-terminal-android (debug-signed APKs, for testing).
# Signed release builds are produced by release.yml.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ${{ github.repository_owner == 'ysamouhos' && 'runner1' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: the legacy `tools` package no longer exists.
          packages: ""

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@2.13.0

      - name: Rust core tests
        working-directory: tetra_core
        run: |
          # frb_generated.rs is created by codegen in the next step; tests do not need it.
          sed -i '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs

      - name: App setup (platform folders, Rust bridge, bindings)
        working-directory: app
        run: |
          chmod +x tool/setup.sh
          ./tool/setup.sh

      - name: Analyze + test
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APKs
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          # Named after the app and its version, ready to install.
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk             ../out/TetraTerminal-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   ../out/TetraTerminal-$V-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/TetraTerminal-$V-arm32.apk

      # One upload per file: with archive off the APK downloads as it is, not in a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}-arm64.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: out/TetraTerminal-${{ env.APP_VERSION }}-arm32.apk
          archive: false
