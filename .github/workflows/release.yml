# Release: builds Android + iOS, tags the commit and publishes a GitHub Release.
#
# Start it either way:
#   * Actions tab -> "Release" -> Run workflow -> enter a version (e.g. 1.2.0)
#   * or push a tag:  git tag v1.2.0 && git push origin v1.2.0
#
# The version becomes the app's version name (Android versionName / iOS
# CFBundleShortVersionString); the run number becomes the build number.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, without the v), e.g. 1.2.0"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  FRB_VERSION: 2.13.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::'$V' is not a semver version like 1.2.0"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $V (build ${GITHUB_RUN_NUMBER})"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core
      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
      - name: Android SDK tools on PATH
        run: echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Rust core tests
        working-directory: tetra_core
        run: |
          sed -i '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs
      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh
      - name: Analyze + test
        working-directory: app
        run: flutter analyze --no-fatal-infos && flutter test
      - name: Release signing key
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a release signed with a throwaway key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          keytool -list -keystore app/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | head -3

      - name: Build APKs
        working-directory: app
        run: |
          ARGS="--release --build-name ${{ needs.version.outputs.name }} --build-number ${{ needs.version.outputs.number }}"
          # Phone build without the Accessibility key service (Play Protect
          # blocks sideloaded apps that have one), then the PoC radio build with it.
          python3 tool/android_variant.py phone
          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          V=${{ needs.version.outputs.name }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk             ../dist/TetraTerminal-$V-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   ../dist/TetraTerminal-$V-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/TetraTerminal-$V-android-arm32.apk
          python3 tool/android_variant.py poc
          flutter build apk $ARGS --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk             ../dist/TetraTerminal-$V-android-poc.apk
          ls -la ../dist
          # Fail if the APK is still signed with the Android debug key.
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ../dist/*-android-universal.apk | tee /tmp/certs.txt
          ! grep -q "CN=Android Debug" /tmp/certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Same build as ios.yml: Xcode 26 for the Live Activity, the widget
      # extension, and a fallback without it so the IPA is always produced.
      - name: Select Xcode
        continue-on-error: true
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core
      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh
      - name: Pin iOS platform in Podfile
        working-directory: app
        run: |
          flutter build ios --config-only --no-codesign
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          (cd ios && pod install --repo-update)
      - name: Live Activity + home screen widget extension
        continue-on-error: true
        working-directory: app
        run: |
          cp -R ios ../ios-without-widgets
          bash ios_widgets/install.sh
      - name: Build for device (unsigned)
        id: device
        continue-on-error: true
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --build-name ${{ needs.version.outputs.name }} --build-number ${{ needs.version.outputs.number }}
      - name: Build for device without the widget extension (fallback)
        if: steps.device.outcome == 'failure'
        working-directory: app
        run: |
          echo "::warning::The build with the Live Activity / widget extension failed (see the step above). Building the app without it."
          rm -rf ios build/ios && cp -R ../ios-without-widgets ios
          flutter build ios --release --no-codesign \
            --build-name ${{ needs.version.outputs.name }} --build-number ${{ needs.version.outputs.number }}
      - name: Package IPA
        working-directory: app
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ -d "$APP/PlugIns/TetraWidgets.appex" ]; then
            # Ad-hoc signature carrying the App Group entitlements, so tools that
            # re-sign the IPA (Sideloadly, AltStore) can keep them for the widget.
            ( set +e
              for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done
              codesign --force --sign - --entitlements ios/TetraWidgets/TetraWidgets.entitlements "$APP/PlugIns/TetraWidgets.appex" &&
              codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP" ) || echo "::warning::Ad-hoc signing failed; the IPA is unsigned."
          fi
          V=${{ needs.version.outputs.name }}
          mkdir -p ../dist/Payload
          cp -R "$APP" ../dist/Payload/
          (cd ../dist && zip -qr TetraTerminal-$V-ios-unsigned.ipa Payload && rm -rf Payload)
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Which file is for which device, how to install, and the changelog
      # section of this version.
      - name: Release notes
        run: python3 app/tool/release_notes.py "${{ needs.version.outputs.name }}" | tee notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: TETRA Terminal ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || contains(needs.version.outputs.name, '-') }}
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            dist/*.apk
            dist/*.ipa
            dist/SHA256SUMS.txt
