# Signs the iOS app with the Apple developer account and uploads it to
# TestFlight (App Store Connect). Started by hand (Actions -> TestFlight ->
# Run workflow) or by a version tag.
#
# Repository settings -> Secrets and variables -> Actions:
#   secret APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   secret APP_STORE_CONNECT_ISSUER_ID   its issuer ID
#   secret APP_STORE_CONNECT_KEY_BASE64  the key's .p8 file, base64 encoded
#   APPLE_TEAM_ID (variable or secret)   team ID of the developer account
# The bundle id (org.tmoaustria.tetraterminal) is set by app/tool/setup.sh.
# The key needs the Admin role: Xcode then creates the certificate and the
# provisioning profiles itself (cloud signing), nothing else to upload.
#
# The build number is this workflow's run number, so every upload is new.
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing settings
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APP_STORE_CONNECT_KEY_BASE64"
          if [ -n "$missing" ]; then echo "::error::Missing in the repository settings:$missing"; exit 1; fi
          mkdir -p ~/private_keys
          printf '%s' "$P8" | tr -d ' \n\r' | base64 -D > ~/private_keys/AuthKey_$KEY_ID.p8
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_$KEY_ID.p8 || { echo "::error::APP_STORE_CONNECT_KEY_BASE64 is not a base64 encoded .p8 key"; exit 1; }

      - name: Select Xcode
        continue-on-error: true
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@2.13.0

      - name: Build number = run number
        working-directory: app
        run: |
          sed -i '' -E "s/^(version: *[0-9.]+)\+.*/\1+${{ github.run_number }}/" pubspec.yaml
          grep -m1 '^version:' pubspec.yaml

      - name: App setup (platform folders, Rust bridge, bindings)
        working-directory: app
        run: |
          chmod +x tool/setup.sh
          ./tool/setup.sh

      - name: Podfile, pods
        working-directory: app
        run: |
          flutter build ios --config-only --release --no-codesign
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          (cd ios && pod install --repo-update)

      - name: Live Activity + home screen widget extension
        working-directory: app
        run: bash ios_widgets/install.sh

      - name: Info.plist for the App Store
        working-directory: app
        run: |
          # No own encryption beyond HTTPS/TLS: no export compliance question per build.
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/Runner/Info.plist

      - name: Archive (signed)
        working-directory: app
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Flutter's own signing check only knows local certificates; xcodebuild
          # signs below with the API key.
          flutter build ios --config-only --release --no-codesign
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
          || {
            # A development profile needs a registered device in the team. Without
            # one, archive unsigned and let the export sign for distribution.
            echo "::warning::Signed archive failed (no device in the team?). Archiving unsigned; the export signs it."
            rm -rf build/Runner.xcarchive
            xcodebuild archive \
              -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive \
              DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          }

      - name: Upload to TestFlight
        working-directory: app
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//')
          echo "Uploaded $V to App Store Connect. It shows up in TestFlight after Apple's processing (usually 5-30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
