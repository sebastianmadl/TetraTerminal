name: tetra_mic
description: iOS microphone capture for TETRA Terminal that survives audio route and hardware changes.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TetraMicPlugin
